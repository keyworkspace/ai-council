<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Key Industries · AI Council</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIt8vIJ6S0MWdY5naXSDuy7kEf2RwlJ-w",
      authDomain: "ai-council-18bd7.firebaseapp.com",
      projectId: "ai-council-18bd7",
      storageBucket: "ai-council-18bd7.firebasestorage.app",
      messagingSenderId: "717086047531",
      appId: "1:717086047531:web:933650322e9a79c5ca596e",
      measurementId: "G-0Q7QSR76NY"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.googleProvider = new GoogleAuthProvider();
    window.firebaseFuncs = { signInWithPopup, onAuthStateChanged, signOut, doc, onSnapshot };
  </script>

  <script>
    const autoVersion = new Date().getTime();
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'assets/css/styles.css?v=' + autoVersion;
    document.head.appendChild(link);
    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'assets/js/app.js?v=' + autoVersion;
    document.head.appendChild(script);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo-container">
        <div class="logo-icon">⚡</div>
        <div>
          <h1>KEY INDUSTRIES</h1>
          <span class="subtitle">Deliberación Multiagente</span>
        </div>
      </div>
      
      <button id="btn-new-room" class="btn-primary">
        <span class="icon">+</span> Nueva Sesión
      </button>
      
      <div class="section-title">Salas Activas</div>
      <ul id="room-list" class="room-list"></ul>
      
      <div class="section-title">Personal Asignado</div>
      <ul id="agent-list" class="agent-list"></ul>

      <!-- SECCIÓN DE LOGIN Y CRÉDITOS -->
      <div id="auth-section" style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 1rem;">
        <button id="btn-login" class="btn-primary" style="width: 100%;">Iniciar sesión con Google</button>
        
        <div id="user-info" class="hidden" style="display: flex; align-items: center; gap: 0.5rem; justify-content: space-between;">
          <img id="user-avatar" src="" style="width: 32px; height: 32px; border-radius: 50%;">
          <span id="user-name" style="font-size: 0.85rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
          <span id="user-credits" class="badge" style="background: var(--accent-cyan); color: #000; font-weight: bold;">50</span>
          <button id="btn-logout" class="btn-icon-mini" title="Cerrar sesión" style="color: var(--danger);">✖</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="room-header">
        <div class="header-info">
          <div class="title-wrapper">
            <button id="btn-toggle-sidebar" class="btn-icon-mini" title="Ocultar menú" style="font-size: 1.2rem; margin-right: 5px;">☰</button>
            <h2 id="room-name">Selecciona o crea una sesión</h2>
            <button id="btn-edit-room-name" class="btn-icon-mini" title="Renombrar sala">✏️</button>
          </div>
          <p id="room-topic" class="topic">·</p>
        </div>
        <div class="room-actions">
          <span id="room-status" class="badge">En espera</span>
          <button id="btn-export" class="btn-icon" title="Exportar">⬇</button>
          <button id="btn-delete-room" class="btn-icon danger" title="Eliminar">🗑</button>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite">
        <div class="empty-state">
          <div class="empty-icon">🛸</div>
          <h3>Sistemas en espera</h3>
          <p>Inicia sesión para comenzar la deliberación.</p>
        </div>
      </div>

      <button id="btn-scroll-bottom" class="btn-scroll-bottom hidden" title="Ir al último mensaje">⬇</button>

      <div class="composer">
        <div class="composer-controls">
          <select id="mode-select" class="tech-select">
            <option value="autonomous">Modo Autónomo</option>
            <option value="directed">Modo Dirigido</option>
          </select>
          <select id="agent-select" class="tech-select" disabled>
            <option value="">· Agente ·</option>
          </select>
          <div class="rounds-input">
            <label>Ciclos</label>
            <input type="number" id="max-rounds" value="3" min="1" max="10">
          </div>
          <button id="btn-stop" class="btn-icon danger" disabled title="Detener">⏹</button>
        </div>
        
        <div class="composer-input-wrapper">
          <textarea id="user-input" rows="1" placeholder="Escribe un comunicado para el consejo..."></textarea>
          
          <input type="file" id="file-input" accept=".html,.css,.js,.json,.txt,.md" style="display: none;">
          
          <button id="btn-attach" class="btn-icon" title="Adjuntar archivo" style="background: transparent; border: none; font-size: 1.2rem; width: 40px; height: 40px;">
            📎
          </button>

          <button id="btn-send" class="btn-send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
        
        <div id="file-preview" class="file-preview hidden">
          <span id="file-name-display">archivo.html</span>
          <button id="btn-remove-file" class="btn-remove-file" title="Quitar archivo">✖</button>
        </div>
      </div>
    </main>
  </div>

  <dialog id="dialog-room" class="tech-dialog">
    <form method="dialog" id="form-room">
      <h3>Inicializar Nueva Sesión</h3>
      <label>Identificador de la Sala <input type="text" id="input-room-name" required maxlength="80" placeholder="Ej. Análisis de Proyecto"></label>
      <label>Seleccionar Agentes
        <div id="agent-checkboxes" class="checkbox-grid"></div>
      </label>
      <menu>
        <button type="button" id="btn-cancel-room" class="btn-ghost">Cancelar</button>
        <button type="submit" class="btn-primary">Iniciar</button>
      </menu>
    </form>
  </dialog>
</body>
</html>
