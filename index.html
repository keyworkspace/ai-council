        <div class="composer-input-wrapper">
          <textarea id="user-input" rows="1" placeholder="Escribe un comunicado para el consejo..."></textarea>
          
          <!-- 🚨 INPUT DE ARCHIVO OCULTO 🚨 -->
          <input type="file" id="file-input" accept=".html,.css,.js,.json,.txt,.md" style="display: none;">
          
          <!-- 🚨 BOTÓN DE ADJUNTAR 🚨 -->
          <button id="btn-attach" class="btn-icon" title="Adjuntar archivo (HTML, CSS, TXT)" style="background: transparent; border: none; font-size: 1.2rem; width: 40px; height: 40px;">
            📎
          </button>

          <button id="btn-send" class="btn-send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
        
        <!-- 🚨 VISTA PREVIA DEL ARCHIVO ADJUNTO 🚨 -->
        <div id="file-preview" class="file-preview hidden">
          <span id="file-name-display">archivo.html</span>
          <button id="btn-remove-file" class="btn-remove-file" title="Quitar archivo">✖</button>
        </div>
